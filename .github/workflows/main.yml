name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
      - name: Build module
        run: |
          ${{ steps.setup-ndk.outputs.ndk-path }}/ndk-build -C module/src/main NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=module/src/main/cpp/Android.mk NDK_APPLICATION_MK=module/src/main/cpp/Application.mk
          mkdir -p out/zygisk
          cp module/libs/arm64-v8a/libzygisk.so out/zygisk/arm64-v8a.so
          cp module/libs/armeabi-v7a/libzygisk.so out/zygisk/armeabi-v7a.so
          cp module/src/main/module.prop out/
          cd out && zip -r ../Zygisk-Il2CppDumper-Oxide.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Zygisk-Il2CppDumper-Oxide
          path: Zygisk-Il2CppDumper-Oxide.zip
          
